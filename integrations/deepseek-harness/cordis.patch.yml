- id: directory-picker
  disabled: true

# Relay owns the replaceable workbench frame while DSH lacks generic side and
# bottom panel extension points. All official sidebar/conversation occupants
# continue to mount into the same slot contracts.
- id: ui-layout
  disabled: true

- insert:
    # Keep workspace selection inside the Web UI so remote clients can use it.
    - id: relay-directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: relay-ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: relay-runtime-host
      name: relay-dsh-plugin
      config:
        pollIntervalMs: 1000
